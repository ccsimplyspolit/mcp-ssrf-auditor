name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run Unit Test Suite
        run: python -m unittest discover -v
      - name: Verify CLI Scanning & SARIF v2.1.0 Generation
        run: |
          mcp-ssrf-auditor tests/fixtures/safe_tools.json
          mcp-ssrf-auditor tests/fixtures/vulnerable_tools.json --sarif > audit.sarif || true
          test -s audit.sarif
